# 单机零成本编排：FastAPI 后端 + Next.js 前端 + Nginx 统一入口
# 用法: 先 cp .env.example .env 配置模型，再 docker compose up -d --build
services:
  app:
    build: .
    env_file: .env
    volumes:
      - "./data:/app/data"
      - "./logs:/app/logs"      # 函数级调用日志落到宿主机 logs/
    expose: ["8000"]
    restart: unless-stopped

  web:
    build:
      context: ./web
      # 不注入 base URL：前端走同源 /api，由 Nginx 反代到后端
    depends_on: [app]
    expose: ["3000"]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["80:80"]
    depends_on: [app, web]
    restart: unless-stopped

  # 可选：本地 LLM（provider=ollama 时启用）
  # ollama:
  #   image: ollama/ollama
  #   volumes: ["./ollama:/root/.ollama"]
  #   expose: ["11434"]
  #   restart: unless-stopped

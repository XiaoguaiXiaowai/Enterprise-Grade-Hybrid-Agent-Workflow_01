# playground.pangliantagege.top —— 企业级混合 Agent 工作流 Demo（主机 nginx HTTPS 入口）
# 反代到本机 docker 容器（docker-compose.prod.yml）：
#   /       -> web(Next.js)  127.0.0.1:3000
#   /api/   -> app(FastAPI)  127.0.0.1:8001  （SSE 必须关闭缓冲）
# 安装方式：cp 到 /etc/nginx/sites-available/aep-playground.conf 后 nginx -t && reload
# （证书由 certbot 管理，自动续期）

limit_req_zone $binary_remote_addr zone=authlimit:10m rate=5r/m;

server {
  server_name playground.pangliantagege.top;

  # 安全响应头
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer-when-downgrade" always;

  # Gzip 压缩
  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_vary on;

  # 前端（Next.js）
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 后端 API + SSE（SSE 需关缓冲，工单事件流 /api/tickets/{id}/events）
  location /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
  }

  # 常用端点直通
  location = /docs          { proxy_pass http://127.0.0.1:8001/docs; }
  location = /openapi.json  { proxy_pass http://127.0.0.1:8001/openapi.json; }
  location = /health        { proxy_pass http://127.0.0.1:8001/health; }
  # 注意：/metrics 是前端监控页面（web/app/metrics，登录后展示指标看板），
  # 由 location / 反代到 Next.js。不要在此加 /metrics 重定向，否则会劫持前端页面。

  # 登录 / 播种端点限流
  location = /api/auth/login { limit_req zone=authlimit burst=40 nodelay; proxy_pass http://127.0.0.1:8001/api/auth/login; }
  location = /api/auth/seed  { limit_req zone=authlimit burst=5 nodelay;  proxy_pass http://127.0.0.1:8001/api/auth/seed; }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/playground.pangliantagege.top/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/playground.pangliantagege.top/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = playground.pangliantagege.top) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  server_name playground.pangliantagege.top;
  listen 80;
  return 404; # managed by Certbot
}
